name: Apply Library UX patch

on:
  push:
    branches:
      - agent/library-continue-icon-no-apk
    paths:
      - .github/workflows/apply-library-ux-patch.yml

permissions:
  contents: write

jobs:
  patch-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scratch branch
        uses: actions/checkout@v6
        with:
          ref: agent/library-continue-icon-no-apk
          fetch-depth: 1

      - name: Apply guarded Library wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/app/ownplay/player/ui/library/UnifiedLibraryRoute.kt')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''private enum class UnifiedLibraryFilter {\n    ALL,\n    MOVIES,\n    SERIES,\n}\n''',
                  '''private enum class UnifiedLibraryFilter {\n    MOVIES,\n    SERIES,\n    ALL,\n}\n''',
                  'Library filter order',
              ),
              (
                  '''    var filter by remember(isTelevision) {\n        mutableStateOf(\n            if (isTelevision) UnifiedLibraryFilter.MOVIES else UnifiedLibraryFilter.ALL,\n        )\n    }\n''',
                  '''    var filter by remember(isTelevision) {\n        mutableStateOf(UnifiedLibraryFilter.MOVIES)\n    }\n''',
                  'Mobile Library default',
              ),
              (
                  '''    var offlineOnly by remember(isTelevision) { mutableStateOf(!isTelevision) }\n''',
                  '''    var offlineOnly by remember(isTelevision) { mutableStateOf(false) }\n''',
                  'Offline initial state',
              ),
              (
                  '''    val hasItems = movieCount + seriesCount > 0\n''',
                  '''    val showMovieContinueWatching =\n        filter == UnifiedLibraryFilter.MOVIES &&\n            !offlineOnly &&\n            normalizedQuery.isBlank() &&\n            vodCatalog.continueWatching.isNotEmpty()\n    val showSeriesContinueWatching =\n        filter == UnifiedLibraryFilter.SERIES &&\n            !offlineOnly &&\n            normalizedQuery.isBlank() &&\n            seriesCatalog.continueWatching.isNotEmpty()\n    val hasItems =\n        movieCount + seriesCount > 0 || showMovieContinueWatching || showSeriesContinueWatching\n''',
                  'Continue Watching visibility',
              ),
              (
                  '''        if (!hasItems) {\n            LibraryEmptyState(\n''',
                  '''        if (showMovieContinueWatching && sourceId != null) {\n            LibraryMovieContinueWatchingStrip(\n                movies = vodCatalog.continueWatching,\n                onOpenMovie = { movie -> onOpenMovieDetails(sourceId, movie.movieId) },\n            )\n        }\n\n        if (showSeriesContinueWatching && sourceId != null) {\n            LibrarySeriesContinueWatchingStrip(\n                episodes = seriesCatalog.continueWatching,\n                onOpenSeries = { episode -> onOpenSeriesDetails(sourceId, episode.seriesId) },\n            )\n        }\n\n        if (!hasItems) {\n            LibraryEmptyState(\n''',
                  'Continue Watching strips',
              ),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          grep -n "private enum class UnifiedLibraryFilter" -A5 app/src/main/java/app/ownplay/player/ui/library/UnifiedLibraryRoute.kt
          grep -n "showMovieContinueWatching" -A24 app/src/main/java/app/ownplay/player/ui/library/UnifiedLibraryRoute.kt

      - name: Commit guarded patch and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Gersi365'
          git config user.email 'Gersi365@outlook.com'
          git rm .github/workflows/apply-library-ux-patch.yml
          git add app/src/main/java/app/ownplay/player/ui/library/UnifiedLibraryRoute.kt
          git commit -m 'Wire Continue Watching into Library'
          git push origin HEAD:agent/library-continue-icon-no-apk
