name: TEMP Source Sync State Transform

on:
  push:
    branches:
      - agent/source-sync-state-transform-no-apk

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply deterministic per-source sync publication
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/app/ownplay/player/OwnPlayAppRuntime.kt')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 occurrence, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
          '''    private fun rememberSourceState(state: SourceSyncState) {
              val sourceId = state.sourceId ?: return
              _sourceSyncStates.update { current -> current + (sourceId to state) }
          }
          ''',
          '''    private fun rememberSourceState(state: SourceSyncState) {
              val sourceId = state.sourceId ?: return
              _sourceSyncStates.update { current -> current + (sourceId to state) }
          }

          private fun publishSourceState(state: SourceSyncState) {
              _sourceSyncState.value = state
              rememberSourceState(state)
          }
          ''',
          'add publisher',
          )

          replace_once(
          '''        runtimeScope.launch {
              _sourceSyncState.collect(::rememberSourceState)
          }
          ''',
          '',
          'remove conflating collector',
          )

          replace_once(
          '''                _sourceSyncState.value = state
              rememberSourceState(state)
          ''',
          '''                publishSourceState(state)
          ''',
          'staged source state',
          )
          replace_once(
          '''                _sourceSyncState.value = loadingState
              rememberSourceState(loadingState)
          ''',
          '''                publishSourceState(loadingState)
          ''',
          'pending loading state',
          )
          replace_once(
          '''                _sourceSyncState.value = epgState
              rememberSourceState(epgState)
          ''',
          '''                publishSourceState(epgState)
          ''',
          'pending epg state',
          )
          replace_once(
          '''        _sourceSyncState.value = failedState
          rememberSourceState(failedState)
          ''',
          '''        publishSourceState(failedState)
          ''',
          'pending failure state',
          )

          replace_once(
          '''            val state = _sourceSyncState.value
              if (
                  state.sourceId == sourceId &&
                  state.stage == SourceSyncStage.ChannelsFailed
              ) {
                  markRefreshFailed(sourceId, state.failure.toString())
              } else {
                  markRefreshSucceeded(sourceId)
              }
          ''',
          '''            val state = _sourceSyncStates.value[sourceId]
              if (state?.stage == SourceSyncStage.ChannelsFailed) {
                  markRefreshFailed(sourceId, state.failure.toString())
              } else {
                  markRefreshSucceeded(sourceId)
              }
          ''',
          'source-scoped refresh outcome',
          )

          replace_once(
          '''        _sourceSyncState.value = SourceSyncState(
              sourceId = sourceId,
              sourceName = source.name,
              stage = SourceSyncStage.LoadingChannels,
              channelCount = existingCount,
          )
          ''',
          '''        publishSourceState(
              SourceSyncState(
                  sourceId = sourceId,
                  sourceName = source.name,
                  stage = SourceSyncStage.LoadingChannels,
                  channelCount = existingCount,
              ),
          )
          ''',
          'ready refresh loading state',
          )

          replace_once(
          '''            _sourceSyncState.value = SourceSyncState(
                  sourceId = sourceId,
                  sourceName = source.name,
                  stage = SourceSyncStage.ChannelsFailed,
                  channelCount = existingCount,
                  failure = channelResult.reason.toSourceSyncFailure(),
              )
          ''',
          '''            publishSourceState(
                  SourceSyncState(
                      sourceId = sourceId,
                      sourceName = source.name,
                      stage = SourceSyncStage.ChannelsFailed,
                      channelCount = existingCount,
                      failure = channelResult.reason.toSourceSyncFailure(),
                  ),
              )
          ''',
          'ready refresh failure state',
          )

          replace_once(
          '''        _sourceSyncState.value = SourceSyncState(
              sourceId = sourceId,
              sourceName = sourceName,
              stage = SourceSyncStage.ChannelsFailed,
              channelCount = channelCount,
              failure = SourceSyncFailure.Unexpected,
          )
          ''',
          '''        publishSourceState(
              SourceSyncState(
                  sourceId = sourceId,
                  sourceName = sourceName,
                  stage = SourceSyncStage.ChannelsFailed,
                  channelCount = channelCount,
                  failure = SourceSyncFailure.Unexpected,
              ),
          )
          ''',
          'unexpected refresh failure state',
          )

          replace_once(
          '''        _sourceSyncState.value = SourceSyncState(
              sourceId = sourceId,
              sourceName = sourceName,
              stage = SourceSyncStage.LoadingEpg,
              channelCount = channelCount,
          )
          ''',
          '''        publishSourceState(
              SourceSyncState(
                  sourceId = sourceId,
                  sourceName = sourceName,
                  stage = SourceSyncStage.LoadingEpg,
                  channelCount = channelCount,
              ),
          )
          ''',
          'epg loading state',
          )

          replace_once(
          '''        _sourceSyncState.value = if (epg == null) {
              SourceSyncState(
                  sourceId = sourceId,
                  sourceName = sourceName,
                  stage = SourceSyncStage.EpgFailed,
                  channelCount = channelCount,
              )
          } else {
              SourceSyncState(
                  sourceId = sourceId,
                  sourceName = sourceName,
                  stage = SourceSyncStage.Ready,
                  channelCount = channelCount,
                  epgChannelCount = epg.matchedChannelCount,
              )
          }
          ''',
          '''        publishSourceState(
              if (epg == null) {
                  SourceSyncState(
                      sourceId = sourceId,
                      sourceName = sourceName,
                      stage = SourceSyncStage.EpgFailed,
                      channelCount = channelCount,
                  )
              } else {
                  SourceSyncState(
                      sourceId = sourceId,
                      sourceName = sourceName,
                      stage = SourceSyncStage.Ready,
                      channelCount = channelCount,
                      epgChannelCount = epg.matchedChannelCount,
                  )
              },
          )
          ''',
          'epg final state',
          )

          if '_sourceSyncState.collect(::rememberSourceState)' in text:
              raise SystemExit('conflating collector still present')
          if 'val state = _sourceSyncStates.value[sourceId]' not in text:
              raise SystemExit('refresh outcome is not source scoped')
          path.write_text(text)

          test_path = Path('app/src/test/java/app/ownplay/player/SourceSyncPublicationContractTest.kt')
          test_path.write_text('''package app.ownplay.player

          import java.io.File
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class SourceSyncPublicationContractTest {
              @Test
              fun sourceSpecificStatesArePublishedSynchronously() {
                  val source = sourceText("src/main/java/app/ownplay/player/OwnPlayAppRuntime.kt")
                  assertTrue(source.contains("private fun publishSourceState(state: SourceSyncState)"))
                  assertFalse(source.contains("_sourceSyncState.collect(::rememberSourceState)"))

                  val refresh = source
                      .substringAfter("suspend fun refreshSource(sourceId: String)")
                      .substringBefore("suspend fun refreshAllSources()")
                  assertTrue(refresh.contains("val state = _sourceSyncStates.value[sourceId]"))
                  assertFalse(refresh.contains("val state = _sourceSyncState.value"))

                  val pipeline = source
                      .substringAfter("private suspend fun refreshSourcePipeline(sourceId: String)")
                      .substringBefore("private suspend fun refreshXtreamMediaCatalogs")
                  assertTrue(pipeline.contains("publishSourceState("))
                  assertFalse(pipeline.contains("_sourceSyncState.value = SourceSyncState("))

                  val epg = source
                      .substringAfter("private suspend fun loadEpgAfterChannels(")
                      .substringBefore("suspend fun epgSnapshot(")
                  assertTrue(epg.contains("publishSourceState("))
                  assertFalse(epg.contains("_sourceSyncState.value = if (epg == null)"))
              }

              private fun sourceText(relativePath: String): String {
                  val candidates = listOf(File(relativePath), File("app/$relativePath"))
                  return candidates.firstOrNull(File::isFile)?.readText()
                      ?: error("Could not locate source file: $relativePath")
              }
          }
          '''.replace('\n          ', '\n').lstrip())
          PY

          git rm .github/workflows/temp-source-sync-state-transform.yml
          git add app/src/main/java/app/ownplay/player/OwnPlayAppRuntime.kt \
                  app/src/test/java/app/ownplay/player/SourceSyncPublicationContractTest.kt
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Publish source sync state deterministically per source"
          git push origin HEAD:${GITHUB_REF_NAME}
