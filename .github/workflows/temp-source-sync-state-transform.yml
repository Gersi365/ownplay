name: TEMP Source Sync State Transform

on:
  push:
    branches:
      - agent/source-sync-state-transform-no-apk

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply deterministic per-source sync publication
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/app/ownplay/player/OwnPlayAppRuntime.kt')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 occurrence, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "    private fun rememberSourceState(state: SourceSyncState) {\n"
              "        val sourceId = state.sourceId ?: return\n"
              "        _sourceSyncStates.update { current -> current + (sourceId to state) }\n"
              "    }\n",
              "    private fun rememberSourceState(state: SourceSyncState) {\n"
              "        val sourceId = state.sourceId ?: return\n"
              "        _sourceSyncStates.update { current -> current + (sourceId to state) }\n"
              "    }\n\n"
              "    private fun publishSourceState(state: SourceSyncState) {\n"
              "        _sourceSyncState.value = state\n"
              "        rememberSourceState(state)\n"
              "    }\n",
              'add publisher',
          )

          replace_once(
              "        runtimeScope.launch {\n"
              "            _sourceSyncState.collect(::rememberSourceState)\n"
              "        }\n",
              "",
              'remove conflating collector',
          )

          replace_once(
              "                _sourceSyncState.value = state\n"
              "                rememberSourceState(state)\n",
              "                publishSourceState(state)\n",
              'staged source state',
          )
          replace_once(
              "                _sourceSyncState.value = loadingState\n"
              "                rememberSourceState(loadingState)\n",
              "                publishSourceState(loadingState)\n",
              'pending loading state',
          )
          replace_once(
              "                _sourceSyncState.value = epgState\n"
              "                rememberSourceState(epgState)\n",
              "                publishSourceState(epgState)\n",
              'pending epg state',
          )
          replace_once(
              "        _sourceSyncState.value = failedState\n"
              "        rememberSourceState(failedState)\n",
              "        publishSourceState(failedState)\n",
              'pending failure state',
          )

          replace_once(
              "            val state = _sourceSyncState.value\n"
              "            if (\n"
              "                state.sourceId == sourceId &&\n"
              "                state.stage == SourceSyncStage.ChannelsFailed\n"
              "            ) {\n"
              "                markRefreshFailed(sourceId, state.failure.toString())\n"
              "            } else {\n"
              "                markRefreshSucceeded(sourceId)\n"
              "            }\n",
              "            val state = _sourceSyncStates.value[sourceId]\n"
              "            if (state?.stage == SourceSyncStage.ChannelsFailed) {\n"
              "                markRefreshFailed(sourceId, state.failure.toString())\n"
              "            } else {\n"
              "                markRefreshSucceeded(sourceId)\n"
              "            }\n",
              'source-scoped refresh outcome',
          )

          replace_once(
              "        _sourceSyncState.value = SourceSyncState(\n"
              "            sourceId = sourceId,\n"
              "            sourceName = source.name,\n"
              "            stage = SourceSyncStage.LoadingChannels,\n"
              "            channelCount = existingCount,\n"
              "        )\n",
              "        publishSourceState(\n"
              "            SourceSyncState(\n"
              "                sourceId = sourceId,\n"
              "                sourceName = source.name,\n"
              "                stage = SourceSyncStage.LoadingChannels,\n"
              "                channelCount = existingCount,\n"
              "            ),\n"
              "        )\n",
              'ready refresh loading state',
          )

          replace_once(
              "            _sourceSyncState.value = SourceSyncState(\n"
              "                sourceId = sourceId,\n"
              "                sourceName = source.name,\n"
              "                stage = SourceSyncStage.ChannelsFailed,\n"
              "                channelCount = existingCount,\n"
              "                failure = channelResult.reason.toSourceSyncFailure(),\n"
              "            )\n",
              "            publishSourceState(\n"
              "                SourceSyncState(\n"
              "                    sourceId = sourceId,\n"
              "                    sourceName = source.name,\n"
              "                    stage = SourceSyncStage.ChannelsFailed,\n"
              "                    channelCount = existingCount,\n"
              "                    failure = channelResult.reason.toSourceSyncFailure(),\n"
              "                ),\n"
              "            )\n",
              'ready refresh failure state',
          )

          replace_once(
              "        val current = _sourceSyncState.value\n"
              "        val sourceName = if (current.sourceId == sourceId) {\n"
              "            current.sourceName\n"
              "        } else {\n"
              "            try {\n"
              "                database.playlistSourceDao().getById(sourceId)?.name\n"
              "            } catch (cancelled: CancellationException) {\n"
              "                throw cancelled\n"
              "            } catch (_: Exception) {\n"
              "                null\n"
              "            }\n"
              "        }\n"
              "        val channelCount = if (current.sourceId == sourceId) {\n"
              "            current.channelCount\n"
              "        } else {\n"
              "            try {\n"
              "                database.providerCatalogDao().channelsForSource(sourceId)\n"
              "                    .count { channel -> channel.availability != ChannelAvailability.REMOVED }\n"
              "            } catch (cancelled: CancellationException) {\n"
              "                throw cancelled\n"
              "            } catch (_: Exception) {\n"
              "                0\n"
              "            }\n"
              "        }\n"
              "        _sourceSyncState.value = SourceSyncState(\n"
              "            sourceId = sourceId,\n"
              "            sourceName = sourceName,\n"
              "            stage = SourceSyncStage.ChannelsFailed,\n"
              "            channelCount = channelCount,\n"
              "            failure = SourceSyncFailure.Unexpected,\n"
              "        )\n",
              "        val current = _sourceSyncStates.value[sourceId]\n"
              "        val sourceName = current?.sourceName ?: try {\n"
              "            database.playlistSourceDao().getById(sourceId)?.name\n"
              "        } catch (cancelled: CancellationException) {\n"
              "            throw cancelled\n"
              "        } catch (_: Exception) {\n"
              "            null\n"
              "        }\n"
              "        val channelCount = current?.channelCount ?: try {\n"
              "            database.providerCatalogDao().channelsForSource(sourceId)\n"
              "                .count { channel -> channel.availability != ChannelAvailability.REMOVED }\n"
              "        } catch (cancelled: CancellationException) {\n"
              "            throw cancelled\n"
              "        } catch (_: Exception) {\n"
              "            0\n"
              "        }\n"
              "        publishSourceState(\n"
              "            SourceSyncState(\n"
              "                sourceId = sourceId,\n"
              "                sourceName = sourceName,\n"
              "                stage = SourceSyncStage.ChannelsFailed,\n"
              "                channelCount = channelCount,\n"
              "                failure = SourceSyncFailure.Unexpected,\n"
              "            ),\n"
              "        )\n",
              'unexpected refresh failure state',
          )

          replace_once(
              "        _sourceSyncState.value = SourceSyncState(\n"
              "            sourceId = sourceId,\n"
              "            sourceName = sourceName,\n"
              "            stage = SourceSyncStage.LoadingEpg,\n"
              "            channelCount = channelCount,\n"
              "        )\n",
              "        publishSourceState(\n"
              "            SourceSyncState(\n"
              "                sourceId = sourceId,\n"
              "                sourceName = sourceName,\n"
              "                stage = SourceSyncStage.LoadingEpg,\n"
              "                channelCount = channelCount,\n"
              "            ),\n"
              "        )\n",
              'epg loading state',
          )

          replace_once(
              "        _sourceSyncState.value = if (epg == null) {\n"
              "            SourceSyncState(\n"
              "                sourceId = sourceId,\n"
              "                sourceName = sourceName,\n"
              "                stage = SourceSyncStage.EpgFailed,\n"
              "                channelCount = channelCount,\n"
              "            )\n"
              "        } else {\n"
              "            SourceSyncState(\n"
              "                sourceId = sourceId,\n"
              "                sourceName = sourceName,\n"
              "                stage = SourceSyncStage.Ready,\n"
              "                channelCount = channelCount,\n"
              "                epgChannelCount = epg.matchedChannelCount,\n"
              "            )\n"
              "        }\n",
              "        publishSourceState(\n"
              "            if (epg == null) {\n"
              "                SourceSyncState(\n"
              "                    sourceId = sourceId,\n"
              "                    sourceName = sourceName,\n"
              "                    stage = SourceSyncStage.EpgFailed,\n"
              "                    channelCount = channelCount,\n"
              "                )\n"
              "            } else {\n"
              "                SourceSyncState(\n"
              "                    sourceId = sourceId,\n"
              "                    sourceName = sourceName,\n"
              "                    stage = SourceSyncStage.Ready,\n"
              "                    channelCount = channelCount,\n"
              "                    epgChannelCount = epg.matchedChannelCount,\n"
              "                )\n"
              "            },\n"
              "        )\n",
              'epg final state',
          )

          if '_sourceSyncState.collect(::rememberSourceState)' in text:
              raise SystemExit('conflating collector still present')
          if 'val state = _sourceSyncStates.value[sourceId]' not in text:
              raise SystemExit('refresh outcome is not source scoped')
          if 'val current = _sourceSyncStates.value[sourceId]' not in text:
              raise SystemExit('unexpected failure lookup is not source scoped')
          path.write_text(text)

          test_path = Path('app/src/test/java/app/ownplay/player/SourceSyncPublicationContractTest.kt')
          test_path.write_text('''package app.ownplay.player

          import java.io.File
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class SourceSyncPublicationContractTest {
              @Test
              fun sourceSpecificStatesArePublishedSynchronously() {
                  val source = sourceText("src/main/java/app/ownplay/player/OwnPlayAppRuntime.kt")
                  assertTrue(source.contains("private fun publishSourceState(state: SourceSyncState)"))
                  assertFalse(source.contains("_sourceSyncState.collect(::rememberSourceState)"))

                  val refresh = source
                      .substringAfter("suspend fun refreshSource(sourceId: String)")
                      .substringBefore("suspend fun refreshAllSources()")
                  assertTrue(refresh.contains("val state = _sourceSyncStates.value[sourceId]"))
                  assertFalse(refresh.contains("val state = _sourceSyncState.value"))

                  val pipeline = source
                      .substringAfter("private suspend fun refreshSourcePipeline(sourceId: String)")
                      .substringBefore("private suspend fun refreshXtreamMediaCatalogs")
                  assertTrue(pipeline.contains("publishSourceState("))
                  assertFalse(pipeline.contains("_sourceSyncState.value = SourceSyncState("))

                  val unexpectedFailure = source
                      .substringAfter("private suspend fun publishUnexpectedRefreshFailure(sourceId: String)")
                      .substringBefore("private suspend fun loadEpgAfterChannels(")
                  assertTrue(unexpectedFailure.contains("val current = _sourceSyncStates.value[sourceId]"))
                  assertFalse(unexpectedFailure.contains("val current = _sourceSyncState.value"))

                  val epg = source
                      .substringAfter("private suspend fun loadEpgAfterChannels(")
                      .substringBefore("suspend fun epgSnapshot(")
                  assertTrue(epg.contains("publishSourceState("))
                  assertFalse(epg.contains("_sourceSyncState.value = if (epg == null)"))
              }

              private fun sourceText(relativePath: String): String {
                  val candidates = listOf(File(relativePath), File("app/$relativePath"))
                  return candidates.firstOrNull(File::isFile)?.readText()
                      ?: error("Could not locate source file: $relativePath")
              }
          }
          '''.replace('\n          ', '\n').lstrip())
          PY

          git rm .github/workflows/temp-source-sync-state-transform.yml
          git add app/src/main/java/app/ownplay/player/OwnPlayAppRuntime.kt \
                  app/src/test/java/app/ownplay/player/SourceSyncPublicationContractTest.kt
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Publish source sync state deterministically per source"
          git push origin HEAD:${GITHUB_REF_NAME}
