name: Agent Multi-source Structural Patch

on:
  push:
    branches:
      - agent/multisource-lifecycle-hardening-no-apk

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply structural multi-source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f"{path}: expected at least {count} occurrence(s), found {actual}: {old[:120]!r}")
              text = text.replace(old, new, count)
              p.write_text(text)

          def regex_replace(path, pattern, repl, count=1):
              p = Path(path)
              text = p.read_text()
              new, n = re.subn(pattern, repl, text, count=count, flags=re.S | re.M)
              if n != count:
                  raise SystemExit(f"{path}: regex replacement expected {count}, got {n}: {pattern[:120]!r}")
              p.write_text(new)

          staging = r'''package app.ownplay.player.source.onboarding

import androidx.room.withTransaction
import app.ownplay.player.persistence.OwnPlayDatabase
import app.ownplay.player.persistence.PlaylistRefreshStateEntity
import app.ownplay.player.persistence.PlaylistSourceEntity
import app.ownplay.player.persistence.RefreshStates
