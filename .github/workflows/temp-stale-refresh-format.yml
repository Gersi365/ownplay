name: TEMP Stale Refresh Format

on:
  push:
    branches:
      - agent/stale-refresh-coalesce-transform-no-apk

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Normalize generated Kotlin formatting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('app/src/main/java/app/ownplay/player/OwnPlayAppRuntime.kt')
          text = path.read_text()

          stale_start = text.index('    private suspend fun refreshSourceIfStale(sourceId: String) {')
          stale_end = text.index('    private suspend fun completePendingSource(sourceId: String)', stale_start)
          stale_block = dedent('''\
              private suspend fun refreshSourceIfStale(sourceId: String) {
                  runReadyRefresh(
                      sourceId = sourceId,
                      onlyIfStale = true,
                  )
              }

          ''')
          stale_block = ''.join('    ' + line if line.strip() else line for line in stale_block.splitlines(keepends=True))
          text = text[:stale_start] + stale_block + text[stale_end:]

          lifecycle_start = text.index('    private suspend fun runReadyRefresh(')
          lifecycle_end = text.index('    suspend fun refreshAllSources()', lifecycle_start)
          lifecycle_block = dedent('''\
              private suspend fun runReadyRefresh(
                  sourceId: String,
                  onlyIfStale: Boolean,
              ) {
                  try {
                      refreshMutex.withLock {
                          if (!sourceExists(sourceId)) return@withLock
                          if (onlyIfStale) {
                              val refreshState = try {
                                  database.refreshStateDao().get(sourceId)
                              } catch (cancelled: CancellationException) {
                                  throw cancelled
                              } catch (_: Exception) {
                                  null
                              }
                              if (
                                  !shouldRefreshSource(
                                      lastSuccessAtEpochMillis = refreshState?.lastSuccessAtEpochMillis,
                                      nowEpochMillis = System.currentTimeMillis(),
                                  )
                              ) {
                                  return@withLock
                              }
                          }
                          executeReadyRefreshLocked(sourceId)
                      }
                  } catch (cancelled: CancellationException) {
                      throw cancelled
                  } catch (_: Exception) {
                      refreshMutex.withLock {
                          if (sourceExists(sourceId)) {
                              publishUnexpectedRefreshFailure(sourceId)
                              markRefreshFailed(sourceId, "unexpected")
                          }
                      }
                  }
              }

              private suspend fun executeReadyRefreshLocked(sourceId: String) {
                  markRefreshRunning(sourceId)
                  when (val outcome = refreshSourcePipelineLocked(sourceId)) {
                      ReadyRefreshOutcome.Missing -> Unit
                      ReadyRefreshOutcome.Succeeded -> markRefreshSucceeded(sourceId)
                      is ReadyRefreshOutcome.ChannelsFailed -> {
                          markRefreshFailed(sourceId, outcome.failure.toString())
                      }
                  }
              }

              suspend fun refreshSource(sourceId: String) {
                  runReadyRefresh(
                      sourceId = sourceId,
                      onlyIfStale = false,
                  )
              }

          ''')
          lifecycle_block = ''.join('    ' + line if line.strip() else line for line in lifecycle_block.splitlines(keepends=True))
          text = text[:lifecycle_start] + lifecycle_block + text[lifecycle_end:]

          pipeline_start = text.index('    private suspend fun refreshSourcePipelineLocked(')
          pipeline_end = text.index('    private suspend fun refreshXtreamMediaCatalogs', pipeline_start)
          pipeline_block = dedent('''\
              private suspend fun refreshSourcePipelineLocked(
                  sourceId: String,
              ): ReadyRefreshOutcome {
                  val source = database.playlistSourceDao().getById(sourceId)
                      ?: return ReadyRefreshOutcome.Missing
                  val existingCount = try {
                      database.providerCatalogDao().channelsForSource(sourceId)
                          .count { channel -> channel.availability != ChannelAvailability.REMOVED }
                  } catch (cancelled: CancellationException) {
                      throw cancelled
                  } catch (_: Exception) {
                      0
                  }
                  publishSourceState(
                      SourceSyncState(
                          sourceId = sourceId,
                          sourceName = source.name,
                          stage = SourceSyncStage.LoadingChannels,
                          channelCount = existingCount,
                      ),
                  )

                  val channelResult = refreshLiveCatalogInternal(
                      sourceId = sourceId,
                      sourceKind = source.sourceKind,
                  )
                  if (channelResult is SourceOnboardingResult.Failure) {
                      val failure = channelResult.reason.toSourceSyncFailure()
                      publishSourceState(
                          SourceSyncState(
                              sourceId = sourceId,
                              sourceName = source.name,
                              stage = SourceSyncStage.ChannelsFailed,
                              channelCount = existingCount,
                              failure = failure,
                          ),
                      )
                      if (source.sourceKind == SourceKinds.XTREAM) {
                          refreshXtreamMediaCatalogs(sourceId)
                      }
                      return ReadyRefreshOutcome.ChannelsFailed(failure)
                  }
                  channelResult as SourceOnboardingResult.Success

                  loadEpgAfterChannels(
                      sourceId = sourceId,
                      sourceName = source.name,
                      channelCount = channelResult.channelCount,
                  )
                  if (source.sourceKind == SourceKinds.XTREAM) {
                      refreshXtreamMediaCatalogs(sourceId)
                  }
                  return ReadyRefreshOutcome.Succeeded
              }

          ''')
          pipeline_block = ''.join('    ' + line if line.strip() else line for line in pipeline_block.splitlines(keepends=True))
          text = text[:pipeline_start] + pipeline_block + text[pipeline_end:]
          text = text.replace('}\n\n\nclass OwnPlayAppRuntime(', '}\n\nclass OwnPlayAppRuntime(', 1)
          path.write_text(text)

          test = dedent('''\
              package app.ownplay.player

              import java.io.File
              import org.junit.Assert.assertFalse
              import org.junit.Assert.assertTrue
              import org.junit.Test

              class SourceSyncPublicationContractTest {
                  @Test
                  fun sourceSpecificStatesArePublishedSynchronously() {
                      val source = sourceText("src/main/java/app/ownplay/player/OwnPlayAppRuntime.kt")
                      assertTrue(source.contains("private fun publishSourceState(state: SourceSyncState)"))
                      assertFalse(source.contains("_sourceSyncState.collect(::rememberSourceState)"))

                      val staleRefresh = source
                          .substringAfter("private suspend fun refreshSourceIfStale(sourceId: String)")
                          .substringBefore("private suspend fun completePendingSource(sourceId: String)")
                      assertTrue(staleRefresh.contains("runReadyRefresh("))
                      assertTrue(staleRefresh.contains("onlyIfStale = true"))
                      assertFalse(staleRefresh.contains("refreshSource(sourceId)"))

                      val lifecycle = source
                          .substringAfter("private suspend fun runReadyRefresh(")
                          .substringBefore("private suspend fun executeReadyRefreshLocked")
                      assertTrue(lifecycle.contains("refreshMutex.withLock"))
                      assertTrue(lifecycle.contains("if (onlyIfStale)"))
                      assertTrue(lifecycle.contains("database.refreshStateDao().get(sourceId)"))
                      assertTrue(lifecycle.contains("shouldRefreshSource("))
                      assertTrue(lifecycle.contains("executeReadyRefreshLocked(sourceId)"))
                      val freshnessIndex = lifecycle.indexOf("shouldRefreshSource(")
                      val executionIndex = lifecycle.indexOf("executeReadyRefreshLocked(sourceId)")
                      assertTrue(freshnessIndex >= 0 && freshnessIndex < executionIndex)

                      val execution = source
                          .substringAfter("private suspend fun executeReadyRefreshLocked(sourceId: String)")
                          .substringBefore("suspend fun refreshSource(sourceId: String)")
                      assertTrue(execution.contains("markRefreshRunning(sourceId)"))
                      assertTrue(execution.contains("refreshSourcePipelineLocked(sourceId)"))
                      assertTrue(execution.contains("markRefreshSucceeded(sourceId)"))
                      assertTrue(execution.contains("markRefreshFailed(sourceId, outcome.failure.toString())"))
                      assertFalse(execution.contains("refreshMutex.withLock"))
                      val runningIndex = execution.indexOf("markRefreshRunning(sourceId)")
                      val pipelineIndex = execution.indexOf("refreshSourcePipelineLocked(sourceId)")
                      val successIndex = execution.indexOf("markRefreshSucceeded(sourceId)")
                      assertTrue(runningIndex >= 0 && runningIndex < pipelineIndex)
                      assertTrue(pipelineIndex >= 0 && pipelineIndex < successIndex)

                      val manualRefresh = source
                          .substringAfter("suspend fun refreshSource(sourceId: String)")
                          .substringBefore("suspend fun refreshAllSources()")
                      assertTrue(manualRefresh.contains("runReadyRefresh("))
                      assertTrue(manualRefresh.contains("onlyIfStale = false"))

                      val pipeline = source
                          .substringAfter("private suspend fun refreshSourcePipelineLocked(")
                          .substringBefore("private suspend fun refreshXtreamMediaCatalogs")
                      assertTrue(pipeline.contains("publishSourceState("))
                      assertTrue(pipeline.contains("ReadyRefreshOutcome.ChannelsFailed(failure)"))
                      assertTrue(pipeline.contains("ReadyRefreshOutcome.Succeeded"))
                      assertFalse(pipeline.contains("refreshMutex.withLock"))
                      assertFalse(pipeline.contains("_sourceSyncState.value = SourceSyncState("))

                      val unexpectedFailure = source
                          .substringAfter("private suspend fun publishUnexpectedRefreshFailure(sourceId: String)")
                          .substringBefore("private suspend fun loadEpgAfterChannels(")
                      assertTrue(unexpectedFailure.contains("val current = _sourceSyncStates.value[sourceId]"))
                      assertFalse(unexpectedFailure.contains("val current = _sourceSyncState.value"))

                      val epg = source
                          .substringAfter("private suspend fun loadEpgAfterChannels(")
                          .substringBefore("suspend fun epgSnapshot(")
                      assertTrue(epg.contains("publishSourceState("))
                      assertFalse(epg.contains("_sourceSyncState.value = if (epg == null)"))
                  }

                  private fun sourceText(relativePath: String): String {
                      val candidates = listOf(File(relativePath), File("app/$relativePath"))
                      return candidates.firstOrNull(File::isFile)?.readText()
                          ?: error("Could not locate source file: $relativePath")
                  }
              }
          ''')
          Path('app/src/test/java/app/ownplay/player/SourceSyncPublicationContractTest.kt').write_text(test)
          PY

          git rm .github/workflows/temp-stale-refresh-format.yml
          git add app/src/main/java/app/ownplay/player/OwnPlayAppRuntime.kt \
                  app/src/test/java/app/ownplay/player/SourceSyncPublicationContractTest.kt
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Normalize stale refresh lifecycle formatting"
          git push origin HEAD:${GITHUB_REF_NAME}
