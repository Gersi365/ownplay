name: Apply Multisource Import Fix

on:
  pull_request:
    branches:
      - agent/multisource-import-fix-base-no-apk

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ github.head_ref == 'agent/multisource-import-lifecycle-fix-no-apk' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply deterministic import lifecycle fix
        run: python .github/scripts/apply_multisource_import_fix.py

      - name: Verify transformed tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f app/src/main/java/app/ownplay/player/source/PendingImportCoordinator.kt
          test -f app/src/test/java/app/ownplay/player/source/PendingImportCoordinatorTest.kt
          grep -F 'PENDING_IMPORT_TIMEOUT_MILLIS = 120_000L' app/src/main/java/app/ownplay/player/OwnPlayAppRuntime.kt
          grep -F 'maxConcurrentImports = 2' app/src/main/java/app/ownplay/player/OwnPlayAppRuntime.kt
          grep -F 'TextButton(onClick = onDelete)' app/src/main/java/app/ownplay/player/ui/PlaylistSettingsScreen.kt

      - name: Remove transform machinery and commit source only
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/apply_multisource_import_fix.py
          rm .github/workflows/apply-multisource-import-fix.yml
          git config user.name 'Gersi365'
          git config user.email 'Gersi365@outlook.com'
          git add -A
          git diff --cached --check
          git commit -m 'Bound and isolate multi-source imports'
          git push origin HEAD:${{ github.head_ref }}
