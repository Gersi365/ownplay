name: Mobile Phase O QA Update APK

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: mobile-phase-o-qa-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mobile-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Restore stable signing identity
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ownplay-pr16-debug-keystore-v1
          fail-on-cache-miss: true

      - name: Verify stable signing identity
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$HOME/.android/debug.keystore"
          test -f "$KEYSTORE"
          CERT_OUTPUT="$(keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey)"
          printf '%s\n' "$CERT_OUTPUT"
          printf '%s\n' "$CERT_OUTPUT" | grep -F "SHA256: 1B:B7:83:D4:52:C8:5F:3A:A5:C6:25:2C:81:14:99:E2:4A:83:0D:A2:F4:77:EB:92:D9:E2:37:FF:78:17:D5:3A"

      - name: Verify Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/36.0.0"
          test -d "${ANDROID_HOME}/platforms/android-36"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/aapt"

      - name: Checkout exact OwnPlay Mobile candidate
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="7696fb3575194bbd10015fa97f99e41491bc15c6"
          git init mobile-source
          cd mobile-source
          git remote add origin https://github.com/Gersi365/OwnPlay-Mobile.git
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Verify Mobile candidate identity
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE="mobile-source/app/build.gradle.kts"
          grep -F 'applicationId = "app.ownplay.mobile"' "$BUILD_FILE"
          grep -F 'versionCode = 17' "$BUILD_FILE"
          grep -F 'versionName = "1.0.13-product-polish-update"' "$BUILD_FILE"

      - name: Assemble Mobile QA APK
        shell: bash
        run: |
          set -euo pipefail
          cd mobile-source
          gradle \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            --max-workers=2 \
            --no-daemon \
            :app:assembleMobileDebug \
            --stacktrace

      - name: Verify Mobile QA APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/36.0.0"
          EXPECTED_CERT="1bb783d452c85f3aa5c6252c811499e24a830da2f477eb92d9e237ff7817d53a"
          INPUT="mobile-source/app/build/outputs/apk/mobile/debug/app-mobile-debug.apk"
          OUTPUT="mobile-source/app/build/outputs/apk/mobile/debug/OwnPlay-Mobile-Phase-O-QA-code17.apk"

          test -f "$INPUT"
          cp "$INPUT" "$OUTPUT"

          SIGN_OUTPUT="$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUTPUT")"
          printf '%s\n' "$SIGN_OUTPUT"
          printf '%s\n' "$SIGN_OUTPUT" | grep -F "Signer #1 certificate SHA-256 digest: $EXPECTED_CERT"
          printf '%s\n' "$SIGN_OUTPUT" | grep -F "Verified using v2 scheme (APK Signature Scheme v2): true"
          printf '%s\n' "$SIGN_OUTPUT" | grep -Fx "Number of signers: 1"

          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$OUTPUT" | head -n 1)"
          printf '%s\n' "$BADGING"
          printf '%s\n' "$BADGING" | grep -F "name='app.ownplay.mobile'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='17'"
          printf '%s\n' "$BADGING" | grep -F "versionName='1.0.13-product-polish-update'"

          sha256sum "$OUTPUT" | tee "$OUTPUT.sha256"

      - name: Upload Mobile QA APK
        uses: actions/upload-artifact@v4
        with:
          name: ownplay-mobile-phase-o-qa-code17-7696fb3
          path: |
            mobile-source/app/build/outputs/apk/mobile/debug/OwnPlay-Mobile-Phase-O-QA-code17.apk
            mobile-source/app/build/outputs/apk/mobile/debug/OwnPlay-Mobile-Phase-O-QA-code17.apk.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
