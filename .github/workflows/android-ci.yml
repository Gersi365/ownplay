name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name != 'pull_request' || !endsWith(github.head_ref, '-no-apk') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Restore QA signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ownplay-pr16-debug-keystore-v1

      - name: Verify Android SDK 36
        shell: bash
        run: |
          test -d "${ANDROID_HOME}/platforms/android-36"
          test -x "${ANDROID_HOME}/build-tools/36.0.0/zipalign"
          test -x "${ANDROID_HOME}/build-tools/36.0.0/apksigner"

      - name: Validate and assemble Mobile release APK
        run: >-
          gradle
          :app:kspMobileReleaseKotlin
          :app:testMobileReleaseUnitTest
          :app:lintMobileRelease
          :app:assembleMobileRelease
          --stacktrace

      - name: Align and sign Mobile release APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$HOME/.android/debug.keystore"
          INPUT="app/build/outputs/apk/mobile/release/app-mobile-release-unsigned.apk"
          ALIGNED="app/build/outputs/apk/mobile/release/app-mobile-release-aligned.apk"
          OUTPUT="app/build/outputs/apk/mobile/release/OwnPlay-Mobile.apk"
          test -f "$INPUT"
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -f -p 4 "$INPUT" "$ALIGNED"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$OUTPUT" \
            "$ALIGNED"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "$OUTPUT"
          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey

      - name: Verify Room schema is committed
        if: success()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path("app/schemas")
          problems = []
          generated = sorted(root.rglob("*.json"))
          for path in generated:
              relative = path.as_posix()
              try:
                  committed_text = subprocess.check_output(
                      ["git", "show", f"HEAD:{relative}"],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
              except subprocess.CalledProcessError:
                  problems.append(f"Uncommitted Room schema: {relative}")
                  continue
              try:
                  generated_json = json.loads(path.read_text(encoding="utf-8"))
                  committed_json = json.loads(committed_text)
              except json.JSONDecodeError as error:
                  problems.append(f"Invalid Room schema JSON in {relative}: {error}")
                  continue
              if generated_json != committed_json:
                  problems.append(f"Room schema drift: {relative}")

          committed_paths = subprocess.check_output(
              ["git", "ls-tree", "-r", "--name-only", "HEAD", "app/schemas"],
              text=True,
          ).splitlines()
          for relative in committed_paths:
              if relative.endswith(".json") and not pathlib.Path(relative).is_file():
                  problems.append(f"Committed Room schema missing from build output: {relative}")

          if problems:
              print("\n".join(problems))
              sys.exit(1)
          PY

      - name: Upload Mobile release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ownplay-mobile-release-apk
          path: app/build/outputs/apk/mobile/release/OwnPlay-Mobile.apk
          if-no-files-found: error
          retention-days: 7
