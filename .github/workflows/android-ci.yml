name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name != 'pull_request' || !endsWith(github.head_ref, '-no-apk') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Preserve isolated QA debug signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ownplay-m3u-qa-debug-keystore-v1

      - name: Verify Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          test -d "${ANDROID_HOME}/platforms/android-36"
          test -x "${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          test -x "${ANDROID_HOME}/build-tools/36.0.0/aapt"

      - name: Validate and assemble Mobile and TV QA APKs
        shell: bash
        run: |
          set -euo pipefail
          gradle \
            :app:kspMobileDebugKotlin \
            :app:kspTvDebugKotlin \
            :app:testMobileDebugUnitTest \
            :app:testTvDebugUnitTest \
            :app:lintMobileDebug \
            :app:lintTvDebug \
            :app:compileMobileDebugAndroidTestKotlin \
            :app:compileTvDebugAndroidTestKotlin \
            :app:assembleMobileDebug \
            :app:assembleTvDebug \
            --stacktrace

      - name: Verify isolated QA package IDs and signatures
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/36.0.0"
          MOBILE_INPUT="app/build/outputs/apk/mobile/debug/app-mobile-debug.apk"
          TV_INPUT="app/build/outputs/apk/tv/debug/app-tv-debug.apk"
          MOBILE_OUTPUT="app/build/outputs/apk/mobile/debug/OwnPlay-Mobile-M3U-QA.apk"
          TV_OUTPUT="app/build/outputs/apk/tv/debug/OwnPlay-TV-M3U-QA.apk"

          test -f "$MOBILE_INPUT"
          test -f "$TV_INPUT"
          cp "$MOBILE_INPUT" "$MOBILE_OUTPUT"
          cp "$TV_INPUT" "$TV_OUTPUT"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$MOBILE_OUTPUT"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$TV_OUTPUT"

          MOBILE_BADGING="$("$BUILD_TOOLS/aapt" dump badging "$MOBILE_OUTPUT" | head -n 1)"
          TV_BADGING="$("$BUILD_TOOLS/aapt" dump badging "$TV_OUTPUT" | head -n 1)"
          printf '%s\n' "$MOBILE_BADGING"
          printf '%s\n' "$TV_BADGING"
          printf '%s\n' "$MOBILE_BADGING" | grep -F "name='app.ownplay.mobile.qa'"
          printf '%s\n' "$TV_BADGING" | grep -F "name='app.ownplay.tv.qa'"

          sha256sum "$MOBILE_OUTPUT" | tee "$MOBILE_OUTPUT.sha256"
          sha256sum "$TV_OUTPUT" | tee "$TV_OUTPUT.sha256"

      - name: Verify Room schema is committed
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path("app/schemas")
          problems = []
          generated = sorted(root.rglob("*.json"))
          if not generated:
              problems.append("No Room schema JSON generated.")

          for path in generated:
              relative = path.as_posix()
              try:
                  committed_text = subprocess.check_output(
                      ["git", "show", f"HEAD:{relative}"],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
              except subprocess.CalledProcessError:
                  problems.append(f"Uncommitted Room schema: {relative}")
                  continue

              try:
                  generated_json = json.loads(path.read_text(encoding="utf-8"))
                  committed_json = json.loads(committed_text)
              except json.JSONDecodeError as error:
                  problems.append(f"Invalid Room schema JSON in {relative}: {error}")
                  continue

              if generated_json != committed_json:
                  problems.append(f"Room schema drift: {relative}")

          committed_paths = subprocess.check_output(
              ["git", "ls-tree", "-r", "--name-only", "HEAD", "app/schemas"],
              text=True,
          ).splitlines()
          for relative in committed_paths:
              if relative.endswith(".json") and not pathlib.Path(relative).is_file():
                  problems.append(f"Committed Room schema missing from build output: {relative}")

          if problems:
              print("\n".join(problems))
              sys.exit(1)
          PY

      - name: Upload Mobile M3U QA APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ownplay-mobile-m3u-qa
          path: |
            app/build/outputs/apk/mobile/debug/OwnPlay-Mobile-M3U-QA.apk
            app/build/outputs/apk/mobile/debug/OwnPlay-Mobile-M3U-QA.apk.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload TV M3U QA APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ownplay-tv-m3u-qa
          path: |
            app/build/outputs/apk/tv/debug/OwnPlay-TV-M3U-QA.apk
            app/build/outputs/apk/tv/debug/OwnPlay-TV-M3U-QA.apk.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload Room schema
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ownplay-room-schema-m3u-qa
          path: app/schemas
          if-no-files-found: error
          retention-days: 7
