name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name != 'pull_request' || !endsWith(github.head_ref, '-no-apk') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Restore stable signing identity
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ownplay-pr16-debug-keystore-v1
          fail-on-cache-miss: true

      - name: Verify stable signing identity
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$HOME/.android/debug.keystore"
          test -f "$KEYSTORE"
          CERT_OUTPUT="$(keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey)"
          printf '%s\n' "$CERT_OUTPUT"
          printf '%s\n' "$CERT_OUTPUT" | grep -F "SHA256: 1B:B7:83:D4:52:C8:5F:3A:A5:C6:25:2C:81:14:99:E2:4A:83:0D:A2:F4:77:EB:92:D9:E2:37:FF:78:17:D5:3A"

      - name: Verify Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/36.0.0"
          test -d "${ANDROID_HOME}/platforms/android-36"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/aapt"

      - name: Assemble Mobile stable-update test APK
        shell: bash
        run: |
          set -euo pipefail
          gradle \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            --max-workers=2 \
            --no-daemon \
            :app:assembleMobileDebug \
            --stacktrace

      - name: Assemble TV stable-update test APK
        shell: bash
        run: |
          set -euo pipefail
          gradle \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            --max-workers=2 \
            --no-daemon \
            :app:assembleTvDebug \
            --stacktrace

      - name: Verify stable-update compatibility
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/36.0.0"
          EXPECTED_CERT="1bb783d452c85f3aa5c6252c811499e24a830da2f477eb92d9e237ff7817d53a"
          MOBILE_INPUT="app/build/outputs/apk/mobile/debug/app-mobile-debug.apk"
          TV_INPUT="app/build/outputs/apk/tv/debug/app-tv-debug.apk"
          MOBILE_OUTPUT="app/build/outputs/apk/mobile/debug/OwnPlay-Mobile-Product-Polish-1.0.13.apk"
          TV_OUTPUT="app/build/outputs/apk/tv/debug/OwnPlay-TV-QA-1.0.13.apk"

          verify_one() {
            local input="$1"
            local output="$2"
            local expected_package="$3"
            test -f "$input"
            cp "$input" "$output"
            SIGN_OUTPUT="$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$output")"
            printf '%s\n' "$SIGN_OUTPUT"
            printf '%s\n' "$SIGN_OUTPUT" | grep -F "Signer #1 certificate SHA-256 digest: $EXPECTED_CERT"
            BADGING="$("$BUILD_TOOLS/aapt" dump badging "$output" | head -n 1)"
            printf '%s\n' "$BADGING"
            printf '%s\n' "$BADGING" | grep -F "name='$expected_package'"
            printf '%s\n' "$BADGING" | grep -F "versionCode='15'"
            printf '%s\n' "$BADGING" | grep -F "versionName='1.0.13-product-polish-update'"
            sha256sum "$output" | tee "$output.sha256"
          }

          verify_one "$MOBILE_INPUT" "$MOBILE_OUTPUT" app.ownplay.mobile
          verify_one "$TV_INPUT" "$TV_OUTPUT" app.ownplay.tv

      - name: Upload Mobile stable-compatible update APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ownplay-mobile-product-polish-1.0.13
          path: |
            app/build/outputs/apk/mobile/debug/OwnPlay-Mobile-Product-Polish-1.0.13.apk
            app/build/outputs/apk/mobile/debug/OwnPlay-Mobile-Product-Polish-1.0.13.apk.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload TV stable-compatible update APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ownplay-tv-qa-1.0.13
          path: |
            app/build/outputs/apk/tv/debug/OwnPlay-TV-QA-1.0.13.apk
            app/build/outputs/apk/tv/debug/OwnPlay-TV-QA-1.0.13.apk.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
