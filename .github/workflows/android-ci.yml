name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name != 'pull_request' || !endsWith(github.head_ref, '-no-apk') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Restore QA signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ownplay-pr16-debug-keystore-v1

      - name: Ensure QA signing identity
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey

      - name: Verify Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          test -d "${ANDROID_HOME}/platforms/android-36"
          test -x "${ANDROID_HOME}/build-tools/36.0.0/zipalign"
          test -x "${ANDROID_HOME}/build-tools/36.0.0/apksigner"

      - name: Validate and assemble Mobile and TV QA APKs
        run: >-
          gradle
          :app:kspMobileReleaseKotlin
          :app:kspTvReleaseKotlin
          :app:testMobileDebugUnitTest
          :app:testTvDebugUnitTest
          :app:lintMobileRelease
          :app:lintTvRelease
          :app:assembleMobileRelease
          :app:assembleTvRelease
          --stacktrace

      - name: Align and sign QA APKs
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$HOME/.android/debug.keystore"

          MOBILE_INPUT="app/build/outputs/apk/mobile/release/app-mobile-release-unsigned.apk"
          MOBILE_ALIGNED="app/build/outputs/apk/mobile/release/app-mobile-release-aligned.apk"
          MOBILE_OUTPUT="app/build/outputs/apk/mobile/release/OwnPlay-Mobile-QA.apk"
          test -f "$MOBILE_INPUT"
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -f -p 4 "$MOBILE_INPUT" "$MOBILE_ALIGNED"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$MOBILE_OUTPUT" \
            "$MOBILE_ALIGNED"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$MOBILE_OUTPUT"

          TV_INPUT="app/build/outputs/apk/tv/release/app-tv-release-unsigned.apk"
          TV_ALIGNED="app/build/outputs/apk/tv/release/app-tv-release-aligned.apk"
          TV_OUTPUT="app/build/outputs/apk/tv/release/OwnPlay-TV-QA.apk"
          test -f "$TV_INPUT"
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -f -p 4 "$TV_INPUT" "$TV_ALIGNED"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$TV_OUTPUT" \
            "$TV_ALIGNED"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$TV_OUTPUT"

      - name: Verify Room schema is committed
        if: success()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path("app/schemas")
          problems = []
          generated = sorted(root.rglob("*.json"))
          for path in generated:
              relative = path.as_posix()
              try:
                  committed_text = subprocess.check_output(
                      ["git", "show", f"HEAD:{relative}"],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
              except subprocess.CalledProcessError:
                  problems.append(f"Uncommitted Room schema: {relative}")
                  continue
              try:
                  generated_json = json.loads(path.read_text(encoding="utf-8"))
                  committed_json = json.loads(committed_text)
              except json.JSONDecodeError as error:
                  problems.append(f"Invalid Room schema JSON in {relative}: {error}")
                  continue
              if generated_json != committed_json:
                  problems.append(f"Room schema drift: {relative}")

          committed_paths = subprocess.check_output(
              ["git", "ls-tree", "-r", "--name-only", "HEAD", "app/schemas"],
              text=True,
          ).splitlines()
          for relative in committed_paths:
              if relative.endswith(".json") and not pathlib.Path(relative).is_file():
                  problems.append(f"Committed Room schema missing from build output: {relative}")

          if problems:
              print("\n".join(problems))
              sys.exit(1)
          PY

      - name: Upload Mobile QA APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ownplay-mobile-qa-apk
          path: app/build/outputs/apk/mobile/release/OwnPlay-Mobile-QA.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload TV QA APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ownplay-tv-qa-apk
          path: app/build/outputs/apk/tv/release/OwnPlay-TV-QA.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Room schema
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ownplay-room-schema-qa
          path: app/schemas
          if-no-files-found: error
          retention-days: 7
