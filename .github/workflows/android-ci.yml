name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Verify Android SDK 36
        shell: bash
        run: |
          test -d "${ANDROID_HOME}/platforms/android-36"
          test -d "${ANDROID_HOME}/build-tools/36.0.0"

      - name: Validate
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:compileDebugAndroidTestKotlin --stacktrace

      - name: Upload Room schema
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ownplay-room-schema
          path: app/schemas
          if-no-files-found: error
          retention-days: 7

      - name: Verify Room schema is committed
        if: success()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path("app/schemas")
          problems = []

          generated = sorted(root.rglob("*.json"))
          for path in generated:
              relative = path.as_posix()
              try:
                  committed_text = subprocess.check_output(
                      ["git", "show", f"HEAD:{relative}"],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
              except subprocess.CalledProcessError:
                  problems.append(f"Uncommitted Room schema: {relative}")
                  continue

              try:
                  generated_json = json.loads(path.read_text(encoding="utf-8"))
                  committed_json = json.loads(committed_text)
              except json.JSONDecodeError as error:
                  problems.append(f"Invalid Room schema JSON in {relative}: {error}")
                  continue

              if generated_json != committed_json:
                  problems.append(f"Room schema drift: {relative}")

          committed_paths = subprocess.check_output(
              ["git", "ls-tree", "-r", "--name-only", "HEAD", "app/schemas"],
              text=True,
          ).splitlines()
          for relative in committed_paths:
              if relative.endswith(".json") and not pathlib.Path(relative).is_file():
                  problems.append(f"Committed Room schema missing from build output: {relative}")

          if problems:
              print("\n".join(problems))
              sys.exit(1)
          PY

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ownplay-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
