name: Android Validation No APK

# Temporary source-patch validation lane. It must never assemble or upload an APK.
on:
  workflow_dispatch:
  push:
    branches:
      - agent/live-playback-restructure-no-apk
    paths:
      - ".github/workflows/android-validation-no-apk.yml"

permissions:
  contents: write

concurrency:
  group: android-validation-no-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-no-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply Library offline UX patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:90]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          unified = "app/src/main/java/app/ownplay/player/ui/library/UnifiedLibraryRoute.kt"
          series = "app/src/main/java/app/ownplay/player/ui/library/LibrarySeriesComponents.kt"
          playback = "app/src/main/java/app/ownplay/player/ui/library/LibraryPlaybackScreen.kt"
          downloads = "app/src/main/java/app/ownplay/player/ui/DownloadsSettingsScreen.kt"

          replace_once(
              unified,
              '"Offline media verified on this device"',
              '"Local files on this device · playback works without internet"',
          )
          replace_once(
              unified,
              '                Text("Play", maxLines = 1, softWrap = false)\n',
              '                Text("Play Offline", maxLines = 1, softWrap = false)\n',
          )
          replace_once(
              unified,
              '''                    DownloadStates.COMPLETED -> Button(onClick = onPlay) {\n                        Icon(Icons.Filled.PlayArrow, contentDescription = null, modifier = Modifier.size(18.dp))\n                        Spacer(Modifier.width(5.dp))\n                        Text("Play")\n                    }''',
              '''                    DownloadStates.COMPLETED -> Button(onClick = onPlay) {\n                        Icon(Icons.Filled.PlayArrow, contentDescription = null, modifier = Modifier.size(18.dp))\n                        Spacer(Modifier.width(5.dp))\n                        Text("Play Offline")\n                    }''',
          )
          replace_once(
              unified,
              'text = "${movieOfflineLabel(download)} · Play",',
              'text = "${movieOfflineLabel(download)} · Play Offline",',
          )
          replace_once(
              unified,
              'text = "${movieOfflineLabel(download)} · no longer in active catalog · Play",',
              'text = "${movieOfflineLabel(download)} · no longer in active catalog · Play Offline",',
          )
          replace_once(
              unified,
              '''            MovieStatusText(download = download)\n            download?.let { managedDownload ->''',
              '''            if (download?.libraryOfflinePresentation()?.verifiedOffline == true) {\n                LibraryOfflineBadge()\n            }\n            MovieStatusText(download = download)\n            download?.let { managedDownload ->''',
          )
          replace_once(
              unified,
              '''            Text(\n                text = "${movieOfflineLabel(download)} · no longer in the active catalog",''',
              '''            LibraryOfflineBadge()\n            Text(\n                text = "${movieOfflineLabel(download)} · no longer in the active catalog",''',
          )
          replace_once(
              unified,
              '''            SeriesStatusText(\n                offlineEpisodes = offlineEpisodes,\n                offlineMode = offlineMode,\n            )\n            group?.let { managedGroup ->''',
              '''            if (offlineEpisodes > 0) {\n                LibraryOfflineBadge()\n            }\n            SeriesStatusText(\n                offlineEpisodes = offlineEpisodes,\n                offlineMode = offlineMode,\n            )\n            group?.let { managedGroup ->''',
          )
          replace_once(
              unified,
              '            offlineEpisodes > 0 -> "$offlineEpisodes episode${if (offlineEpisodes == 1) "" else "s"} offline"',
              '            offlineEpisodes > 0 -> requireNotNull(librarySeriesOfflineLabel(offlineEpisodes))',
          )
          replace_once(
              unified,
              'text = if (offlineEpisodes > 0) "$offlineEpisodes offline" else "Series",',
              'text = librarySeriesOfflineLabel(offlineEpisodes) ?: "Series",',
          )
          replace_once(
              unified,
              'text = "$offlineEpisodes offline · local copy",',
              'text = requireNotNull(librarySeriesOfflineLabel(offlineEpisodes)),',
          )
          replace_once(
              unified,
              'text = "$offlineEpisodes episode${if (offlineEpisodes == 1) "" else "s"} offline · local copy",',
              'text = requireNotNull(librarySeriesOfflineLabel(offlineEpisodes)),',
          )
          replace_once(
              unified,
              '''    download.state == DownloadStates.COMPLETED && download.savedToDownloads -> "Phone Downloads · Offline"\n    download.state == DownloadStates.COMPLETED -> "OwnPlay private storage · Offline"''',
              '''    download.state == DownloadStates.COMPLETED -> download.libraryOfflinePresentation().let { presentation ->\n        "${presentation.badgeLabel} · ${presentation.storageLabel}"\n    }''',
          )

          replace_once(
              series,
              '''            Text(\n                text = seriesTransferSummary(''',
              '''            if (completed > 0) {\n                LibraryOfflineBadge()\n            }\n            Text(\n                text = seriesTransferSummary(''',
          )
          replace_once(
              series,
              '    DownloadStates.COMPLETED -> "Downloaded · ${humanBytes(download.bytesDownloaded)}"',
              '    DownloadStates.COMPLETED -> "OFFLINE · Downloaded · ${humanBytes(download.bytesDownloaded)}"',
          )
          replace_once(
              series,
              '''private fun episodeStorageLabel(download: OfflineDownload): String = when {\n    download.state != DownloadStates.COMPLETED -> "Managed by OwnPlay"\n    download.savedToDownloads -> "Phone Downloads · available offline"\n    else -> "OwnPlay private storage · available offline"\n}''',
              '''private fun episodeStorageLabel(download: OfflineDownload): String = when {\n    download.state != DownloadStates.COMPLETED -> "Managed by OwnPlay"\n    download.savedToDownloads -> "Local file · Phone Downloads"\n    else -> "Local file · OwnPlay private storage"\n}''',
          )

          replace_once(
              playback,
              '''    val playbackContextLabel = "$contextLabel · " + if (session.download.savedToDownloads) {\n        "Phone Downloads"\n    } else {\n        "OwnPlay private storage"\n    }''',
              '''    val playbackContextLabel = "$contextLabel · OFFLINE · Local file · " + if (session.download.savedToDownloads) {\n        "Phone Downloads"\n    } else {\n        "OwnPlay private storage"\n    }''',
          )
          replace_once(
              playback,
              '''                Spacer(Modifier.width(6.dp))\n                Column(modifier = Modifier.weight(1f)) {''',
              '''                Spacer(Modifier.width(6.dp))\n                LibraryOfflineBadge(modifier = Modifier.padding(end = 7.dp))\n                Column(modifier = Modifier.weight(1f)) {''',
          )

          replace_once(
              downloads,
              'text = "Downloaded · ${downloadStorageLabel(download)} · ${humanBytes(download.bytesDownloaded)}",',
              'text = "OFFLINE · Local file · ${downloadStorageLabel(download)} · ${humanBytes(download.bytesDownloaded)}",',
          )
          PY

          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Verify Android SDK 36
        shell: bash
        run: |
          test -d "${ANDROID_HOME}/platforms/android-36"
          test -d "${ANDROID_HOME}/build-tools/36.0.0"

      - name: Compile and validate without APK
        run: >-
          gradle
          :app:kspDebugKotlin
          :app:testDebugUnitTest
          :app:lintDebug
          :app:compileDebugAndroidTestKotlin
          --stacktrace

      - name: Verify no APK was produced
        shell: bash
        run: |
          if find app/build -type f -name '*.apk' -print -quit | grep -q .; then
            echo 'Unexpected APK produced by no-APK validation.' >&2
            find app/build -type f -name '*.apk' -print >&2
            exit 1
          fi

      - name: Upload Room schema only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ownplay-room-schema-no-apk
          path: app/schemas
          if-no-files-found: error
          retention-days: 7

      - name: Verify Room schema is committed
        if: success()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path('app/schemas')
          problems = []

          generated = sorted(root.rglob('*.json'))
          if not generated:
              problems.append('No Room schema JSON generated.')

          for path in generated:
              relative = path.as_posix()
              try:
                  committed_text = subprocess.check_output(
                      ['git', 'show', f'HEAD:{relative}'],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
              except subprocess.CalledProcessError:
                  problems.append(f'Uncommitted Room schema: {relative}')
                  continue

              try:
                  generated_json = json.loads(path.read_text(encoding='utf-8'))
                  committed_json = json.loads(committed_text)
              except json.JSONDecodeError as error:
                  problems.append(f'Invalid Room schema JSON in {relative}: {error}')
                  continue

              if generated_json != committed_json:
                  problems.append(f'Room schema drift: {relative}')

          committed_paths = subprocess.check_output(
              ['git', 'ls-tree', '-r', '--name-only', 'HEAD', 'app/schemas'],
              text=True,
          ).splitlines()
          for relative in committed_paths:
              if relative.endswith('.json') and not pathlib.Path(relative).is_file():
                  problems.append(f'Committed Room schema missing from generated output: {relative}')

          if problems:
              print('\n'.join(problems))
              sys.exit(2)
          PY

      - name: Commit validated Library offline UX
        if: success()
        shell: bash
        run: |
          git config user.name "OwnPlay Validation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            app/src/main/java/app/ownplay/player/ui/library/UnifiedLibraryRoute.kt \
            app/src/main/java/app/ownplay/player/ui/library/LibrarySeriesComponents.kt \
            app/src/main/java/app/ownplay/player/ui/library/LibraryPlaybackScreen.kt \
            app/src/main/java/app/ownplay/player/ui/DownloadsSettingsScreen.kt
          if git diff --cached --quiet; then
            echo 'Expected Library offline UX source changes were not staged.' >&2
            exit 1
          fi
          git commit -m "Clarify Library offline playback UX"
          git push origin "HEAD:${GITHUB_REF_NAME}"
