name: Android Validation No APK

# Temporary push trigger is scoped to this workflow file so the validated source commit does not
# recursively trigger another run. This lane must never assemble or upload an APK.
on:
  workflow_dispatch:
  push:
    branches:
      - agent/live-playback-restructure-no-apk
    paths:
      - .github/workflows/android-validation-no-apk.yml

permissions:
  contents: write

concurrency:
  group: android-validation-no-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-no-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply Live teardown hardening patch
        shell: bash
        run: |
          python3 .github/scripts/apply_live_teardown_hardening.py
          git diff --check
          git status --short

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Verify Android SDK 36
        shell: bash
        run: |
          test -d "${ANDROID_HOME}/platforms/android-36"
          test -d "${ANDROID_HOME}/build-tools/36.0.0"

      - name: Compile and validate without APK
        run: >-
          gradle
          :app:kspDebugKotlin
          :app:testDebugUnitTest
          :app:lintDebug
          :app:compileDebugAndroidTestKotlin
          --stacktrace

      - name: Verify no APK was produced
        shell: bash
        run: |
          if find app/build -type f -name '*.apk' -print -quit | grep -q .; then
            echo 'Unexpected APK produced by no-APK validation.' >&2
            find app/build -type f -name '*.apk' -print >&2
            exit 1
          fi

      - name: Upload Room schema only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ownplay-room-schema-no-apk
          path: app/schemas
          if-no-files-found: error
          retention-days: 7

      - name: Verify Room schema is committed
        if: success()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path('app/schemas')
          problems = []

          generated = sorted(root.rglob('*.json'))
          if not generated:
              problems.append('No Room schema JSON generated.')

          for path in generated:
              relative = path.as_posix()
              try:
                  committed_text = subprocess.check_output(
                      ['git', 'show', f'HEAD:{relative}'],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
              except subprocess.CalledProcessError:
                  problems.append(f'Uncommitted Room schema: {relative}')
                  continue

              try:
                  generated_json = json.loads(path.read_text(encoding='utf-8'))
                  committed_json = json.loads(committed_text)
              except json.JSONDecodeError as error:
                  problems.append(f'Invalid Room schema JSON in {relative}: {error}')
                  continue

              if generated_json != committed_json:
                  problems.append(f'Room schema drift: {relative}')

          committed_paths = subprocess.check_output(
              ['git', 'ls-tree', '-r', '--name-only', 'HEAD', 'app/schemas'],
              text=True,
          ).splitlines()
          for relative in committed_paths:
              if relative.endswith('.json') and not pathlib.Path(relative).is_file():
                  problems.append(f'Committed Room schema missing from generated output: {relative}')

          if problems:
              print('\n'.join(problems))
              sys.exit(2)
          PY

      - name: Commit validated Live teardown hardening
        if: success()
        shell: bash
        run: |
          git config user.name "OwnPlay Validation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            app/src/main/java/app/ownplay/player/playback/LivePlaybackPresentation.kt \
            app/src/main/java/app/ownplay/player/ui/OwnPlayApp.kt \
            app/src/test/java/app/ownplay/player/playback/LivePlaybackPresentationPolicyTest.kt
          if git diff --cached --quiet; then
            echo 'No validated source changes to commit.'
            exit 0
          fi
          git commit -m "Harden Live playback surface teardown"
          git push origin HEAD:agent/live-playback-restructure-no-apk
